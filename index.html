<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="logo.png.png">

<meta charset="UTF-8">
<title>Revista Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="estilos.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6ec1e4">
</head>

<body>

<!-- ================= ENCABEZADO ================= -->
<header class="header text-center">
    <div class="logo-container">
    <img src="logo.png.png" class="logo">
</div>

    <h1 class="titulo">Revista Digital</h1>
    <h3 class="subtitulo">Unidad Educativa Santa Narcisa de Jesús</h3>
</header>

<!-- ================= BOTONES ================= -->
<div class="container my-5 text-center">

  <div class="row g-4">

    <!-- NOTICIAS -->
    <div class="col-md-3">
        <button class="card-btn"
            data-bs-toggle="modal"
            data-bs-target="#noticias">
            📰<br>Noticias
        </button>
    </div>

    <!-- EVENTOS -->
    <div class="col-md-3">
        <button class="card-btn"
            data-bs-toggle="modal"
            data-bs-target="#eventos">
            📅<br>Eventos
        </button>
    </div>

    <!-- EXPERIENCIAS -->
    <div class="col-md-3">
        <button class="card-btn"
            data-bs-toggle="modal"
            data-bs-target="#experiencias">
            💬<br>Experiencias
        </button>
    </div>
    <div class="col-md-3">
    <button class="card-btn"
        data-bs-toggle="modal"
        data-bs-target="#loginHistorial">
        🏛️<br>Historial Institucional
    </button>
</div>


</div>


<!-- ================= MODALES ================= -->

<!-- MODAL NOTICIAS -->
<div class="modal fade" id="noticias">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-style">

            <div class="modal-header">
                <h5>Noticias Institucionales</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="text" id="tituloNoticia"
                    class="form-control mb-2"
                    placeholder="Título de la noticia">

                <textarea id="textoNoticia"
                    class="form-control mb-3"
                    placeholder="Descripción de la noticia"></textarea>

                <button class="btn btn-primary w-100 mb-3"
                    onclick="agregarNoticias()">
                    ➕ Agregar Noticia
                </button>

                <hr>

                <div id="listaNoticias"></div>

            </div>

        </div>
    </div>
</div>


<div class="modal fade" id="eventos">
<div class="modal-dialog modal-lg modal-dialog-centered">
<div class="modal-content modal-style">

<div class="modal-header">
<h5>Eventos Institucionales</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input type="text" id="tituloEvento" class="form-control mb-2"
placeholder="Título del evento">

<input type="date" id="fechaEvento" class="form-control mb-2">

<textarea id="textoEvento" class="form-control mb-3"
placeholder="Descripción del evento"></textarea>

<button class="btn btn-primary w-100 mb-3"
onclick="agregarEvento()">
➕ Agregar evento
</button>

<hr>

<div id="listaEventos"></div>

</div>
</div>
</div>
</div>


<div class="modal fade" id="experiencias">
<div class="modal-dialog modal-lg modal-dialog-centered">
<div class="modal-content modal-style">

<div class="modal-header">
<h5>Experiencias en la Institución</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<textarea id="textoExperiencia"
class="form-control mb-3"
placeholder="Escribe tu experiencia"></textarea>

<button class="btn btn-primary w-100 mb-3"
onclick="agregarExperiencia()">
➕ Publicar experiencia
</button>

<hr>

<div id="listaExperiencias"></div>

</div>
</div>
</div>
</div>
<div class="modal fade" id="loginHistorial">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content modal-style">

<div class="modal-header">
<h5>Acceso restringido</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body text-center">

<input type="password" id="claveHistorial"
class="form-control mb-3"
placeholder="Contraseña">

<button class="btn btn-primary w-100"
onclick="verificarClave()">
Ingresar
</button>

</div>
</div>
</div>
</div>
<div class="modal fade" id="historialInstitucional">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-style">
            <div class="modal-header">
                <h5>📘 Historial institucional</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <select id="anioHistorial" class="form-control mb-2">
                    <option value="">Seleccione el año</option>
                    <option>2015</option>
                    <option>2016</option>
                    <option>2017</option>
                    <option>2018</option>
                    <option>2019</option>
                    <option>2020</option>
                    <option>2021</option>
                    <option>2022</option>
                    <option>2023</option>
                    <option>2024</option>
                    <option>2025</option>
                    <option>2026</option>
                    <option>2027</option>
                    <option>2028</option>
                    <option>2029</option>
                    <option>2030</option>
                </select>

                <input type="file" id="fotoHistorial" class="form-control mb-2">
                <input type="text" id="tituloHistoriaInst" class="form-control mb-2" placeholder="Título">
                <input type="date" id="fechaHistoriaInst" class="form-control mb-2">

                <textarea id="textoHistoriaInst" class="form-control mb-3"
                placeholder="Descripción"></textarea>

                <button class="btn btn-primary w-100 mb-3"
                onclick="agregarHistorialInstitucional()">
                ➕ Agregar recuerdo
                </button>

                <hr>
                <div id="galeriaHistorial" class="row"></div>

            </div>
        </div>
    </div>
</div>


</div>
</div>



<footer class="footer">
© 2026 Unidad Educativa Santa Narcisa de Jesús

        <img src="Instagram-Logo.png">
    </a>

    <a href="https://www.facebook.com/UNEDNAJE" target="_blank">
        <img src="2111342.png">
    </a>

    <a href="https://whatsapp.com/channel/0029VbAvA3oH5JLtMiEpjM1m" target="_blank">
        <img src="descarga (2).png">
    </a>
</div>

</footer>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ==================== STORAGE ==================== */
function obtenerDatos(clave) {
    return JSON.parse(localStorage.getItem(clave)) || [];
}

function guardarDatos(clave, datos) {
    localStorage.setItem(clave, JSON.stringify(datos));
}

/* ==================== LOGIN ==================== */
function hash(texto) {
    return btoa(texto);
}
const CLAVE_HASH = "YWRtaW4xMjM=";

function verificarClave() {
    const clave = document.getElementById("claveHistorial").value;
    if (hash(clave) === CLAVE_HASH) {
        bootstrap.Modal.getInstance(
            document.getElementById("loginHistorial")
        ).hide();

        new bootstrap.Modal(
            document.getElementById("historialInstitucional")
        ).show();
    } else {
        alert("Contraseña incorrecta");
    }
}

/* ==================== NOTICIAS ==================== */
function cargarNoticias() {
    const lista = document.getElementById("listaNoticias");
    lista.innerHTML = "";

    obtenerDatos("noticias").forEach((n, i) => {
        lista.innerHTML += `
        <div class="comentario">
            <h6>${n.titulo}</h6>
            <p>${n.texto}</p>
            <button class="btn btn-danger btn-sm"
                onclick="eliminarNoticia(${i})">
                🗑 Eliminar
            </button>
            <hr>
        </div>`;
    });
}

function agregarNoticias() {
    const titulo = tituloNoticia.value;
    const texto = textoNoticia.value;
    if (!titulo || !texto) return alert("Completa todos los campos");

    const datos = obtenerDatos("noticias");
    datos.push({ titulo, texto });
    guardarDatos("noticias", datos);

    tituloNoticia.value = "";
    textoNoticia.value = "";
    cargarNoticias();
}

function eliminarNoticia(i) {
    if (!confirm("¿Eliminar esta noticia?")) return;
    const datos = obtenerDatos("noticias");
    datos.splice(i, 1);
    guardarDatos("noticias", datos);
    cargarNoticias();
}

/* ==================== EVENTOS ==================== */
function cargarEventos() {
    const lista = listaEventos;
    lista.innerHTML = "";

    obtenerDatos("eventos").forEach((e, i) => {
        lista.innerHTML += `
        <div class="comentario">
            <h6>${e.titulo}</h6>
            <small>📅 ${e.fecha}</small>
            <p>${e.texto}</p>
            <button class="btn btn-danger btn-sm"
                onclick="eliminarEvento(${i})">
                🗑 Eliminar
            </button>
            <hr>
        </div>`;
    });
}

function agregarEvento() {
    if (!tituloEvento.value || !fechaEvento.value || !textoEvento.value)
        return alert("Completa todos los campos");

    const datos = obtenerDatos("eventos");
    datos.push({
        titulo: tituloEvento.value,
        fecha: fechaEvento.value,
        texto: textoEvento.value
    });

    guardarDatos("eventos", datos);
    tituloEvento.value = fechaEvento.value = textoEvento.value = "";
    cargarEventos();
}

function eliminarEvento(i) {
    if (!confirm("¿Eliminar este evento?")) return;
    const datos = obtenerDatos("eventos");
    datos.splice(i, 1);
    guardarDatos("eventos", datos);
    cargarEventos();
}

/* ==================== EXPERIENCIAS ==================== */
function cargarExperiencias() {
    listaExperiencias.innerHTML = "";
    obtenerDatos("experiencias").forEach((e, i) => {
        listaExperiencias.innerHTML += `
        <div class="comentario">
            <p>${e}</p>
            <button class="btn btn-danger btn-sm"
                onclick="eliminarExperiencia(${i})">
                🗑 Eliminar
            </button>
            <hr>
        </div>`;
    });
}

function agregarExperiencia() {
    if (!textoExperiencia.value)
        return alert("Escribe una experiencia");

    const datos = obtenerDatos("experiencias");
    datos.push(textoExperiencia.value);
    guardarDatos("experiencias", datos);

    textoExperiencia.value = "";
    cargarExperiencias();
}

function eliminarExperiencia(i) {
    if (!confirm("¿Eliminar esta experiencia?")) return;
    const datos = obtenerDatos("experiencias");
    datos.splice(i, 1);
    guardarDatos("experiencias", datos);
    cargarExperiencias();
}

/* ==================== HISTORIAL ==================== */
function cargarHistorial() {
    galeriaHistorial.innerHTML = "";

    obtenerDatos("historial").forEach((h, index) => {
        galeriaHistorial.innerHTML += `
        <div class="col-md-4 col-12 mb-3">
            <img src="${h.foto}" class="img-fluid rounded shadow mb-2">
            <p class="text-center">
                <b>${h.titulo}</b><br>
                <small>${h.fecha} — ${h.anio}</small><br>
                ${h.texto}
            </p>
            <button class="btn btn-danger btn-sm w-100"
                onclick="eliminarHistorial(${index})">
                🗑 Eliminar
            </button>
        </div>`;
    });
}


function agregarHistorialInstitucional() {
    const foto = fotoHistorial.files[0];
    if (!foto || !tituloHistoriaInst.value || !fechaHistoriaInst.value ||
        !textoHistoriaInst.value || !anioHistorial.value)
        return alert("Completa todos los datos");

    const lector = new FileReader();
    lector.onload = () => {
        const datos = obtenerDatos("historial");
        datos.push({
            foto: lector.result,
            titulo: tituloHistoriaInst.value,
            fecha: fechaHistoriaInst.value,
            texto: textoHistoriaInst.value,
            anio: anioHistorial.value
        });
        guardarDatos("historial", datos);
        cargarHistorial();
    };
    lector.readAsDataURL(foto);
}
function eliminarHistorial(i) {
    if (!confirm("¿Eliminar este recuerdo institucional?")) return;
    const datos = obtenerDatos("historial");
    datos.splice(i, 1);
    guardarDatos("historial", datos);
    cargarHistorial();
}


/* ==================== INICIO ==================== */
document.addEventListener("DOMContentLoaded", () => {
    cargarNoticias();
    cargarEventos();
    cargarExperiencias();
    cargarHistorial();
});
</script>




</body>
</html>
